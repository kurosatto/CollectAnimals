<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CollectAnimals</title>
<style>
  :root { --bg:#f6f4ee; --card:#fff; --ink:#1d2a22; --muted:#6b7a70; --accent:#2f7d4f; --line:#e3e0d6;
          --common:#7a8a80; --uncommon:#2f7d4f; --rare:#2d5fa8; --legendary:#b7791f; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#121815; --card:#1b231e; --ink:#e7eee9; --muted:#93a39a; --line:#2a352f; } }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,sans-serif; background:var(--bg); color:var(--ink); }
  main { max-width:960px; margin:0 auto; padding:16px; }
  header { display:flex; justify-content:space-between; align-items:center; gap:12px; }
  h1 { font-size:1.5rem; margin:.5rem 0; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin:16px 0; }
  input, button { font:inherit; padding:10px 12px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--ink); }
  button { background:var(--accent); color:#fff; border:none; cursor:pointer; }
  button.link { background:none; color:var(--accent); padding:0; }
  form { display:flex; flex-wrap:wrap; gap:8px; }
  .muted { color:var(--muted); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:10px; }
  .tile { border:1px solid var(--line); border-radius:10px; padding:10px; background:var(--card); font-size:.9rem; }
  .tile.locked { opacity:.45; filter:grayscale(1); }
  .tile .num { color:var(--muted); font-size:.75rem; }
  .rarity { font-size:.7rem; text-transform:uppercase; letter-spacing:.05em; font-weight:600; }
  #result.win { border-color:var(--accent); }
  .tile { cursor:pointer; }
  .tile:hover { border-color:var(--accent); }
  .hidden { display:none; }
  .pick { display:inline-flex; align-items:center; padding:10px 12px; border-radius:8px; border:1px solid var(--line);
          background:var(--card); color:var(--ink); cursor:pointer; }
  #photo-name { align-self:center; font-size:.85rem; }
  dialog { border:1px solid var(--line); border-radius:14px; background:var(--card); color:var(--ink);
           padding:0; width:min(560px, calc(100vw - 32px)); }
  dialog::backdrop { background:rgba(0,0,0,.45); }
  .dex { padding:16px; }
  .dex-head { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
  .dex-head h2 { margin:0; }
  .dex-body { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:16px; margin-top:12px; }
  @media (max-width:520px) { .dex-body { grid-template-columns:1fr; } }
  .dex-map svg { width:100%; height:auto; display:block; }
  .dex-map .land { fill:var(--bg); stroke:var(--muted); stroke-width:1.5; stroke-linejoin:round; }
  .dex-map .cell { fill:var(--accent); }
  .dex dt { font-size:.75rem; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin-top:10px; }
  .dex dd { margin:2px 0 0; }
  .hot-wrap { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.2fr); gap:16px; }
  @media (max-width:640px) { .hot-wrap { grid-template-columns:1fr; } }
  .hot-pin { fill:var(--legendary); stroke:var(--card); stroke-width:2; cursor:pointer; }
  .hot-pin.on { fill:var(--accent); }
  .hot-list { display:flex; flex-wrap:wrap; gap:6px; margin-top:12px; }
  .hot-list button { background:var(--bg); color:var(--ink); border:1px solid var(--line); padding:6px 10px; font-size:.85rem; }
  .hot-list button.on { border-color:var(--accent); color:var(--accent); }
  .hot-species { display:flex; flex-wrap:wrap; gap:6px; padding:0; list-style:none; }
  .hot-species li { border:1px solid var(--line); border-radius:999px; padding:3px 10px; font-size:.85rem; cursor:pointer; }
  .hot-species li.caught { border-color:var(--accent); }
  .dex .close { background:none; color:var(--muted); font-size:1.4rem; line-height:1; padding:0 4px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>CollectAnimals <span class="muted" style="font-size:1rem">California</span></h1>
    <div id="who" class="hidden"><span id="username"></span> · <button class="link" id="logout">Log out</button></div>
  </header>

  <section id="auth" class="card">
    <h2 id="auth-title">Log in</h2>
    <form id="auth-form">
      <input id="email" type="email" placeholder="Email" class="hidden">
      <input id="ident" placeholder="Email or username" required>
      <input id="password" type="password" placeholder="Password (8+ chars)" required>
      <button type="submit" id="auth-submit">Log in</button>
    </form>
    <p class="muted"><button class="link" id="toggle">Need an account? Sign up</button></p>
    <p id="auth-error" style="color:#c0392b"></p>
  </section>

  <section id="game" class="hidden">
    <div class="card">
      <h2>Capture an animal</h2>
      <form id="upload-form">
        <label class="pick">📷 Take photo
          <input id="photo-camera" type="file" accept="image/*" capture="environment" hidden></label>
        <label class="pick">🖼️ Choose from photos
          <input id="photo-library" type="file" accept="image/*" hidden></label>
        <span id="photo-name" class="muted"></span>
        <button type="submit">Identify</button>
      </form>
      <div id="result" class="card hidden"></div>
    </div>
    <div class="card" id="hotspots-card">
      <h2>Hotspots</h2>
      <p class="muted" style="margin-top:0">Parks where you can spot lots of the 100. Tap a park to see which ones.</p>
      <div class="hot-wrap">
        <div class="dex-map" id="hot-map"></div>
        <div id="hot-detail"><p class="muted">Pick a park on the map or the list.</p></div>
      </div>
      <div id="hot-list" class="hot-list"></div>
    </div>
    <div class="card">
      <h2>Your collection <span id="progress" class="muted"></span></h2>
      <div id="grid" class="grid"></div>
    </div>
  </section>
</main>
<dialog id="dex"><div class="dex">
  <div class="dex-head">
    <div><div class="num muted" id="dex-num"></div><h2 id="dex-name"></h2>
      <div class="muted" id="dex-sci"></div><div class="rarity" id="dex-rarity"></div></div>
    <button class="close" id="dex-close" aria-label="Close">×</button>
  </div>
  <div class="dex-body">
    <div class="dex-map"><div id="dex-map"></div><div class="muted" id="dex-map-note" style="font-size:.8rem"></div>
      <p id="dex-where" style="margin:8px 0 0"></p></div>
    <dl>
      <dt>Most active</dt><dd id="dex-active"></dd>
      <dt>Spotting tip</dt><dd id="dex-tip"></dd>
      <dt>Hotspots</dt><dd id="dex-hotspots"></dd>
      <dt>Size</dt><dd id="dex-size"></dd>
      <dt>Weight</dt><dd id="dex-weight"></dd>
      <dt>Fun fact</dt><dd id="dex-fact"></dd>
    </dl>
  </div>
</div></dialog>
<script>
const $ = (id) => document.getElementById(id);
let token = null;
try { token = localStorage.getItem("token"); } catch {}
let signup = false;

async function api(path, opts = {}) {
  const headers = opts.headers || {};
  if (token) headers.Authorization = `Bearer ${token}`;
  const res = await fetch(path, { ...opts, headers });
  const body = await res.json().catch(() => ({}));
  if (res.status === 401 && token) { setToken(null); }
  if (!res.ok) {
    const d = body.detail;
    throw new Error(Array.isArray(d) ? d.map((e) => e.msg).join("; ") : d || res.statusText);
  }
  return body;
}

function setToken(t) {
  token = t;
  try { t ? localStorage.setItem("token", t) : localStorage.removeItem("token"); } catch {}
  render();
}

$("toggle").onclick = () => {
  signup = !signup;
  $("auth-title").textContent = $("auth-submit").textContent = signup ? "Sign up" : "Log in";
  $("toggle").textContent = signup ? "Have an account? Log in" : "Need an account? Sign up";
  $("email").classList.toggle("hidden", !signup);
  $("email").required = signup;
  $("ident").placeholder = signup ? "Username" : "Email or username";
};

$("auth-form").onsubmit = async (e) => {
  e.preventDefault();
  $("auth-error").textContent = "";
  try {
    let r;
    if (signup) {
      r = await api("/auth/register", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: $("email").value, username: $("ident").value, password: $("password").value }) });
    } else {
      r = await api("/auth/login", { method: "POST",
        body: new URLSearchParams({ username: $("ident").value, password: $("password").value }) });
    }
    setToken(r.access_token);
  } catch (err) { $("auth-error").textContent = err.message; }
};

$("logout").onclick = () => setToken(null);

// Phones only offer the camera when `capture` is set, so there are two pickers:
// one that opens the camera and one that opens the photo library.
let chosenPhoto = null;
for (const id of ["photo-camera", "photo-library"]) {
  $(id).onchange = () => {
    chosenPhoto = $(id).files[0] || null;
    $("photo-name").textContent = chosenPhoto ? chosenPhoto.name : "";
  };
}

$("upload-form").onsubmit = async (e) => {
  e.preventDefault();
  if (!chosenPhoto) { $("photo-name").textContent = "Pick a photo first"; return; }
  const fd = new FormData();
  fd.append("photo", chosenPhoto);
  const box = $("result");
  box.classList.remove("hidden", "win");
  box.textContent = "Identifying…";
  try {
    const r = await api("/captures", { method: "POST", body: fd });
    box.classList.toggle("win", r.matched);
    box.innerHTML = "";
    const h = document.createElement("strong");
    h.textContent = (r.new_badge ? "🏅 " : "") + r.message;
    const p = document.createElement("p");
    p.className = "muted";
    p.textContent = "Top guesses: " + r.top_predictions
      .map((x) => `${x.common_name || x.label} ${(x.probability * 100).toFixed(0)}%`).join(", ");
    box.append(h, p);
    loadCollection();
  } catch (err) { box.textContent = err.message; }
};

let caughtSlugs = new Set();
let dexNumbers = {};

async function loadCollection() {
  const c = await api("/me/collection");
  caughtSlugs = new Set(c.entries.filter((e) => e.caught).map((e) => e.species.slug));
  c.entries.forEach((e, i) => { dexNumbers[e.species.slug] = i + 1; });
  loadHotspots();
  $("progress").textContent = `${c.caught} / ${c.total}`;
  const grid = $("grid");
  grid.innerHTML = "";
  c.entries.forEach((e, i) => {
    const t = document.createElement("div");
    t.className = "tile" + (e.caught ? "" : " locked");
    const s = e.species;
    t.innerHTML = `<div class="num">#${String(i + 1).padStart(3, "0")}</div><div class="name"></div>
      <div class="muted sci"></div><div class="rarity" style="color:var(--${s.rarity})">${s.rarity}</div>`;
    t.querySelector(".name").textContent = s.common_name + (e.capture_count > 1 ? ` ×${e.capture_count}` : "");
    t.querySelector(".sci").textContent = s.scientific_name;
    t.onclick = () => openDex(s.slug, i + 1, e.caught);
    grid.append(t);
  });
}

// California outline rings as [lon, lat]; this rough fallback is replaced by
// the Natural Earth outline from /map/california when it loads.
let CALIFORNIA = [[[-124.21,42.0],[-120.0,42.0],[-120.0,39.0],[-114.63,35.0],[-114.72,32.72],
  [-117.12,32.53],[-118.52,34.03],[-120.47,34.45],[-121.95,36.6],[-122.51,37.78],[-124.35,40.3]]];
fetch("/map/california").then((r) => r.ok ? r.json() : null)
  .then((o) => { if (o && o.rings) CALIFORNIA = o.rings; }).catch(() => {});
const MAP = { lon0: -124.6, lat1: 42.2, kx: 40 * Math.cos(37 * Math.PI / 180), ky: 40 };
const px = (lon, lat) => [(lon - MAP.lon0) * MAP.kx, (MAP.lat1 - lat) * MAP.ky];

function rangeSvg(range) {
  const w = px(-113.9, 0)[0], h = px(0, 32.3)[1];
  const land = CALIFORNIA.map((ring) => "M" + ring.map(([lon, lat]) =>
    px(lon, lat).map((v) => v.toFixed(1)).join(",")).join("L") + "Z").join("");
  let cells = "";
  if (range) {
    const { lon0, lat0, step } = range.grid;
    const max = Math.max(...range.cells.map((c) => c[2]));
    for (const [col, row, n] of range.cells) {
      const [x, y] = px(lon0 + col * step, lat0 + (row + 1) * step);
      const op = (0.25 + 0.75 * Math.log1p(n) / Math.log1p(max)).toFixed(2);
      cells += `<rect class="cell" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${(step * MAP.kx).toFixed(1)}"
        height="${(step * MAP.ky).toFixed(1)}" opacity="${op}"/>`;
    }
  }
  return `<svg viewBox="0 0 ${w.toFixed(0)} ${h.toFixed(0)}" role="img" aria-label="Map of California sightings">
    <path class="land" d="${land}"/>${cells}</svg>`;
}

async function openDex(slug, num, caught) {
  const d = await api(`/species/${encodeURIComponent(slug)}/dex`);
  const s = d.species;
  $("dex-num").textContent = `#${String(num).padStart(3, "0")}`;
  $("dex-name").textContent = s.common_name;
  $("dex-sci").textContent = s.scientific_name;
  $("dex-rarity").textContent = s.rarity;
  $("dex-rarity").style.color = `var(--${s.rarity})`;
  $("dex-map").innerHTML = rangeSvg(d.range);
  $("dex-map-note").textContent = d.range ? "Where it's been seen (iNaturalist)" : "Sighting map coming soon";
  $("dex-where").textContent = d.where_to_find ? "📍 " + d.where_to_find : "";
  $("dex-active").textContent = d.active_time || "Unknown";
  $("dex-tip").textContent = d.spotting_tip || "—";
  $("dex-hotspots").textContent = d.hotspots.length ? d.hotspots.join(", ") : "—";
  $("dex-size").textContent = d.size || "Unknown";
  $("dex-weight").textContent = d.weight || "Unknown";
  $("dex-fact").textContent = caught ? (d.fun_fact || "—") : "🔒 Catch one to unlock its fun fact.";
  $("dex").showModal();
}
let hotspots = [];
let hotSelected = null;

async function loadHotspots() {
  try { hotspots = await api("/hotspots"); } catch { hotspots = []; }
  $("hotspots-card").classList.toggle("hidden", !hotspots.length);
  if (hotspots.length) drawHotspots();
}

function drawHotspots() {
  const svg = rangeSvg(null).replace("</svg>", hotspots.map((h, i) => {
    const [x, y] = px(h.lon, h.lat);
    const r = 5 + Math.min(7, h.species.length / 6);
    return `<circle class="hot-pin${hotSelected === i ? " on" : ""}" data-i="${i}" cx="${x.toFixed(1)}"
      cy="${y.toFixed(1)}" r="${r.toFixed(1)}"><title></title></circle>`;
  }).join("") + "</svg>");
  $("hot-map").innerHTML = svg;
  $("hot-map").querySelectorAll(".hot-pin").forEach((c) => {
    const h = hotspots[+c.dataset.i];
    c.querySelector("title").textContent = `${h.name}: ${h.species.length} species`;
    c.onclick = () => selectHotspot(+c.dataset.i);
  });
  const list = $("hot-list");
  list.innerHTML = "";
  hotspots.forEach((h, i) => {
    const b = document.createElement("button");
    b.className = hotSelected === i ? "on" : "";
    b.textContent = `${h.name} · ${h.species.length}`;
    b.onclick = () => selectHotspot(i);
    list.append(b);
  });
}

function selectHotspot(i) {
  hotSelected = i;
  const h = hotspots[i];
  const got = h.species.filter((s) => caughtSlugs.has(s.slug)).length;
  const box = $("hot-detail");
  box.innerHTML = `<h3 style="margin:0"></h3><p class="muted blurb"></p><p class="count"></p><ul class="hot-species"></ul>`;
  box.querySelector("h3").textContent = h.name;
  box.querySelector(".blurb").textContent = h.blurb;
  box.querySelector(".count").textContent =
    `You can spot ${h.species.length} of the 100 here. You've caught ${got} of them.`;
  const ul = box.querySelector("ul");
  for (const s of h.species) {
    const li = document.createElement("li");
    li.className = caughtSlugs.has(s.slug) ? "caught" : "";
    li.textContent = (caughtSlugs.has(s.slug) ? "✓ " : "") + s.common_name;
    li.style.color = `var(--${s.rarity})`;
    li.onclick = () => openDex(s.slug, dexNumbers[s.slug] || 0, caughtSlugs.has(s.slug));
    ul.append(li);
  }
  drawHotspots();
}

$("dex-close").onclick = () => $("dex").close();
$("dex").onclick = (e) => { if (e.target === $("dex")) $("dex").close(); };

async function render() {
  const authed = !!token;
  $("auth").classList.toggle("hidden", authed);
  $("game").classList.toggle("hidden", !authed);
  $("who").classList.toggle("hidden", !authed);
  if (authed) {
    try { $("username").textContent = (await api("/me")).username; loadCollection(); } catch {}
  }
}
render();
</script>
</body>
</html>
