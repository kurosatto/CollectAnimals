<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- The live habitat for the app's Field Guide and friends' profiles. The scene
     itself is the website's (backend/app/static/habitat.js, packaged as an asset);
     this page is the little bit of glue the website's index.html provides there.
     Habitat.kt loads it and calls setAnimals(); taps come back via AndroidHabitat. -->
<style>
  /* Field Journal colours, as on the website and in the app's own screens. */
  :root { --ink:#3a2c1c; --muted:#7a6448; --line:#d9c9a3; --card:#fbf5e6; --accent:#4d6b3a; }
  @media (prefers-color-scheme: dark) { :root { --ink:#f0e4c8; --muted:#bba57f; --line:#4a3b28; --card:#2c2318; --accent:#9cbf7c; } }
  html, body { margin:0; padding:0; background:transparent; color:var(--ink);
               font:14px/1.3 "Space Grotesk", system-ui, sans-serif; -webkit-tap-highlight-color:transparent; }
  .hidden { display:none !important; }
  .habitat { position:relative; }
  /* Edge to edge on the phone, no frame (2026-11-04). */
  #hab-canvas { display:block; width:100%; height:auto; image-rendering:pixelated; border-radius:0;
                border:none; border-bottom:3px solid #5b3a22; touch-action:manipulation; }
  .hab-bubble { position:absolute; transform:translate(-50%,-100%); background:var(--card); color:var(--ink);
                border:1px solid var(--line); border-radius:8px; padding:3px 8px; font-size:.8rem; font-weight:600;
                white-space:nowrap; pointer-events:none; box-shadow:0 2px 6px rgba(0,0,0,.15); }
  .hab-bubble.below { transform:translate(-50%,0); }
  .hab-bubble.wide { white-space:normal; width:max-content; max-width:min(260px,90%); }
  .hab-fact { font-weight:400; margin-top:2px; line-height:1.3; }
  .hab-more { font-weight:400; font-size:.72rem; color:var(--muted); margin-top:3px; }
  .hab-more a { pointer-events:auto; color:var(--accent); font-weight:600; text-decoration:none; }
  .hab-bar { display:flex; justify-content:space-between; align-items:center; gap:8px; margin:6px 12px 0; font-size:.8rem; }
  .muted { color:var(--muted); }
  .place { position:absolute; z-index:1; top:6px; left:6px; padding:2px 8px; border-radius:999px; font-size:.75rem;
           background:rgba(0,0,0,.45); color:#fff; pointer-events:none; }
  body.showcase .hab-bar { display:none; }
  button { font:inherit; font-size:.8rem; padding:4px 10px; border-radius:999px; border:1px solid var(--line);
           background:transparent; color:var(--accent); white-space:nowrap; display:inline-flex; align-items:center; gap:4px; }
  /* Same pixel font and icons as the website's phone layout (2026-11-04). */
  @font-face { font-family:"Pixelify Sans"; src:url(/vendor/fonts/pixelify.woff2) format("woff2"); font-weight:400 700; }
  @font-face { font-family:"Space Grotesk"; src:url(/vendor/fonts/spacegrotesk.woff2) format("woff2"); font-weight:300 700; }
  #hab-note, button { font-family:"Pixelify Sans", ui-monospace, monospace; }
  .pi { width:16px; height:16px; image-rendering:pixelated; flex:none; }
  .hab-bar { flex-wrap:wrap; justify-content:flex-end; gap:4px 6px; }
  #hab-note { flex:1 1 100%; }
</style>
</head>
<body>
<div id="habitat" class="habitat">
  <span id="place" class="place hidden"></span>
  <canvas id="hab-canvas" width="320" height="270" aria-label="Your habitat: the animals you've captured"></canvas>
  <div id="hab-bubble" class="hab-bubble hidden"></div>
</div>
<div class="hab-bar"><span id="hab-note" class="muted"></span><button id="hab-peek"></button></div>
<script src="habitat.js"></script>
<script src="decor.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const spriteUrl = (slug, caught) => `/sprites/${encodeURIComponent(slug)}${caught ? "" : "_silhouette"}.png`;
let myState = { code: "" };
let caughtNums = new Set();
let dexNumbers = {};
let slugs = {};
const bridge = window.AndroidHabitat;

// The bubble's "Field Guide" link: open the animal's page in the app.
function openDex(number) {
  if (bridge && slugs[number]) bridge.open(slugs[number]);
}

// What a tapped animal tells you: its main fun fact (sent with your animals, in
// your state's wording), then the shared extras from species/facts.json.
let extraFacts = null;
async function animalFacts(s) {
  if (!extraFacts) extraFacts = fetch("facts.json").then((r) => r.json()).catch(() => ({}));
  return [s.fun_fact, ...((await extraFacts)[s.slug] || [])].filter(Boolean);
}

// entries: [{caught, activity, species: {number, slug, common_name, category, rarity}}].
// visitor: a friend's username to show their habitat instead of yours.
function setAnimals(entries, state, visitor) {
  myState = { code: state || "" };
  slugs = {}; dexNumbers = {};
  entries.forEach((e) => { slugs[e.species.number] = e.species.slug; dexNumbers[e.species.number] = e.species.number; });
  caughtNums = new Set(entries.filter((e) => e.caught).map((e) => e.species.number));
  document.body.classList.remove("showcase");
  $("place").classList.add("hidden");
  const was = hab.visit && hab.visit.username;
  hab.visit = visitor ? { username: visitor, state: myState.code, home: [] } : null;
  if ((visitor || null) !== (was || null)) { hab.animals = []; hab.w = 0; hab.picked = null; hab.fx = []; }
  habitatSet(entries);
  // Your skins and decorations from the minigame shop; a friend's habitat shows none.
  habLookSet(null);
  if (!visitor && bridge && bridge.look) bridge.look();
  reportHeight();
}

// The account screen before you log in: the state's scenery with one featured animal.
function showcase(state, placeName) {
  document.body.classList.add("showcase");
  $("place").textContent = `📍 ${placeName}`;
  $("place").classList.remove("hidden");
  habShowcase(state || "");
  reportHeight();
}

function reportHeight() {
  if (bridge) bridge.height(Math.ceil(document.body.scrollHeight));
}

habInit();
window.addEventListener("resize", reportHeight);
if (bridge) bridge.ready();
</script>
</body>
</html>
