<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- The app's Games tab: the website's minigames (backend/app/static/minigames.js,
     packaged as an asset with habitat.js, which it builds on). Minigames.kt loads
     this page and calls setAnimals() with your captured animals. -->
<style>
  /* The Field Journal look, as on the website: paper colours, Pixelify Sans for headings
     and buttons, Space Grotesk for reading text (both OFL, from vendor/fonts). */
  @font-face { font-family:"Pixelify Sans"; src:url(/vendor/fonts/pixelify.woff2) format("woff2"); font-weight:400 700; }
  @font-face { font-family:"Space Grotesk"; src:url(/vendor/fonts/spacegrotesk.woff2) format("woff2"); font-weight:300 700; }
  :root { --ink:#3a2c1c; --muted:#7a6448; --line:#d9c9a3; --card:#fbf5e6; --accent:#4d6b3a;
          --pixel:"Pixelify Sans", ui-monospace, monospace; --text:"Space Grotesk", system-ui, sans-serif; }
  @media (prefers-color-scheme: dark) { :root { --ink:#f0e4c8; --muted:#bba57f; --line:#4a3b28; --card:#2c2318; --accent:#9cbf7c; } }
  html, body { margin:0; background:transparent; color:var(--ink); font:14px/1.3 var(--text);
               -webkit-tap-highlight-color:transparent; }
  body { padding:12px 16px 24px; }
  h3, button { font-family:var(--pixel); }
  .hidden { display:none !important; }
  .muted { color:var(--muted); }
  p { margin:0 0 12px; }
</style>
</head>
<body>
<p class="muted">Play as one of the animals you captured. Each game unlocks when you capture an animal that suits it.</p>
<div id="minigames"></div>
<script src="habitat.js"></script>
<script src="decor.js"></script>
<script src="minigames.js"></script>
<script>
// entries: [{caught, species: {number, slug, common_name, category}}].
function setAnimals(entries) { mgSet(entries); }
if (window.AndroidMinigames) window.AndroidMinigames.ready();
</script>
</body>
</html>
