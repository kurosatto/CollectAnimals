<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- The app's Games tab: the website's minigames (backend/app/static/minigames.js,
     packaged as an asset with habitat.js, which it builds on). Minigames.kt loads
     this page and calls setAnimals() with your captured animals. -->
<style>
  :root { --ink:#1c2a1c; --muted:#5d6b5d; --line:#d9ddd0; --card:#ffffff; --accent:#2f6f4f; }
  @media (prefers-color-scheme: dark) { :root { --ink:#e6eee6; --muted:#9fb09f; --line:#3a4a3a; --card:#1d261d; --accent:#7fc59a; } }
  html, body { margin:0; background:transparent; color:var(--ink); font:14px/1.3 system-ui, sans-serif;
               -webkit-tap-highlight-color:transparent; }
  body { padding:12px 16px 24px; }
  .hidden { display:none !important; }
  .muted { color:var(--muted); }
  p { margin:0 0 12px; }
</style>
</head>
<body>
<p class="muted">Play as one of the animals you captured. Each game unlocks when you capture an animal that suits it.</p>
<div id="minigames"></div>
<script src="habitat.js"></script>
<script src="decor.js"></script>
<script src="minigames.js"></script>
<script>
// entries: [{caught, species: {number, slug, common_name, category}}].
function setAnimals(entries) { mgSet(entries); }
if (window.AndroidMinigames) window.AndroidMinigames.ready();
</script>
</body>
</html>
