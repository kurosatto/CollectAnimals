<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset your password · Capture Animals</title>
<style>body{font:16px/1.55 system-ui,sans-serif;max-width:720px;margin:0 auto;padding:16px;color:#1d2a1f;background:#f6f8f3}
h1{font-size:1.5rem}a{color:#2e7d32}@media (prefers-color-scheme:dark){body{background:#141a15;color:#e3ebe2}a{color:#8fd694}}</style>
</head><body>
<h1>Reset your Capture Animals password</h1>
<p id="msg">Finding the game server…</p>
<script>
// Reset emails link here because the game server's address changes now and then;
// this page looks it up the same way the app does, then opens the reset form there.
const token = new URLSearchParams(location.search).get("token") || "";
const msg = document.getElementById("msg");
if (!token) msg.textContent = "This page needs the link from your reset email.";
else fetch("https://raw.githubusercontent.com/kurosatto/CollectAnimals/server-url/server.json", { cache: "no-store" })
  .then((r) => r.json())
  .then((j) => location.replace(j.url.replace(/\/$/, "") + "/reset-password?token=" + encodeURIComponent(token)))
  .catch(() => { msg.textContent = "Couldn't find the game server just now. Try this link again in a little while."; });
</script>
</body></html>
